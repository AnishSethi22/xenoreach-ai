services:
  - type: web
    name: xenoreach-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_MODE
        value: true
      - key: DEMO_USER_EMAIL
        value: reviewer@xenoreach.ai
      - key: DEMO_USER_NAME
        value: Demo Reviewer
